<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>يَا أَيُّهَا الَّذِينَ آمَنُوا اذْكُرُوا اللَّهَ ذِكْرًا كَثِيرًا</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW registered!', reg))
        .catch(err => console.log('SW registration failed:', err));
    });
  }
</script>
<style>
  :root {
    --bg1: #eef2f7;
    --bg2: #dfe7f1;
    --card-glass: rgba(255,255,255,0.55);
    --card-border: rgba(255,255,255,0.7);
    --text: #0f172a;
    --text-soft: #475569;
    --shadow: rgba(15,23,42,0.15);
    --btn-bg: rgba(255,255,255,0.65);
    --btn-text: #0f172a;
    --topbar: rgba(255,255,255,0.6);
  }
  body.dark {
    --bg1: #0b1120;
    --bg2: #131c31;
    --card-glass: rgba(30,41,59,0.55);
    --card-border: rgba(148,163,184,0.25);
    --text: #f1f5f9;
    --text-soft: #94a3b8;
    --shadow: rgba(0,0,0,0.45);
    --btn-bg: rgba(30,41,59,0.7);
    --btn-text: #f1f5f9;
    --topbar: rgba(15,23,42,0.7);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text);
    min-height: 100vh;
    transition: background 0.35s, color 0.35s;
  }
  body {
    background-attachment: fixed;
    padding-bottom: 90px;
  }

  /* شريط علوي */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    background: var(--topbar);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--card-border);
  }
  .topbar h1 {
    font-size: 17px; margin: 0; flex: 1;
    font-weight: 700; letter-spacing: 0.3px;
  }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.15s, background 0.25s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .icon-btn:active { transform: scale(0.92); }
  .add-btn { background: linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none; font-weight:700; }

  /* الشبكة */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    padding: 16px;
  }
  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }

  /* المسبحة */
  .counter {
    position: relative;
    border-radius: 20px;
    padding: 16px 12px;
    min-height: 150px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    border: 1px solid var(--card-border);
    background: var(--card-glass);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow: 0 8px 24px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.12s ease, box-shadow 0.25s;
    overflow: hidden;
    animation: pop 0.3s ease;
  }
  .counter::before {
    content: "";
    position: absolute; inset: 0;
    background: var(--tint, transparent);
    opacity: 0.35;
    border-radius: 20px;
    pointer-events: none;
  }
  .counter:active { transform: scale(0.96); }
  .counter .name {
    position: relative; z-index: 1;
    font-size: 15px; font-weight: 700;
    color: var(--text);
    word-break: break-word;
    line-height: 1.3;
    margin-bottom: 6px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.15);
  }
  .counter .count {
    position: relative; z-index: 1;
    font-size: 44px; font-weight: 800;
    color: var(--text);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
  }
  .counter .hint {
    position: relative; z-index: 1;
    font-size: 10px;
    color: var(--text-soft);
    margin-top: 8px;
    opacity: 0.75;
  }
  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* حالة الفراغ */
  .empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-soft);
    font-size: 15px;
    line-height: 1.8;
  }
  .empty .big { font-size: 44px; margin-bottom: 10px; }

  /* نافذة الإضافة */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .overlay.show { display: flex; animation: fade 0.2s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .dialog {
    width: 100%; max-width: 380px;
    background: var(--card-glass);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    animation: slideUp 0.3s cubic-bezier(0.2,0.9,0.3,1.2);
  }
  @keyframes slideUp {
    from { transform: translateY(30px) scale(0.95); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  .dialog h3 {
    margin: 0 0 14px; font-size: 18px; font-weight: 700;
  }
  .dialog p { margin: 0 0 16px; font-size: 14px; color: var(--text-soft); line-height: 1.6; }
  .dialog input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: rgba(127,127,127,0.12);
    color: var(--text);
    font-size: 16px;
    outline: none;
    transition: border 0.2s;
    margin-bottom: 16px;
    font-family: inherit;
  }
  .dialog input:focus { border-color: #8b5cf6; }
  .dialog .actions { display: flex; gap: 10px; }
  .dialog .actions button {
    flex: 1;
    padding: 13px;
    border-radius: 14px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s;
  }
  .dialog .actions button:active { transform: scale(0.96); }
  .btn-cancel { background: var(--btn-bg); color: var(--text); border: 1px solid var(--card-border) !important; }
  .btn-confirm { background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; }
  .btn-danger { background: linear-gradient(135deg,#ef4444,#dc2626); color:#fff; }

  /* رسالة Toast */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: rgba(15,23,42,0.92);
    color: #fff;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    z-index: 200;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.2,0.9,0.3,1.2);
    pointer-events: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <h1>يَا أَيُّهَا الَّذِينَ آمَنُوا اذْكُرُوا اللَّهَ ذِكْرًا كَثِيرًا</h1>
  <button class="icon-btn" id="themeBtn" title="تبديل المظهر">🌙</button>
  <button class="icon-btn add-btn" id="addBtn" title="إضافة مربع">＋</button>
</div>

<div class="grid" id="grid"></div>

<div class="empty" id="emptyState">
  <div class="big">📊</div>
  لا توجد مسبحة بعد<br>
  اضغط زر <b>＋</b> بالأعلى لإضافة أول مسبحة
</div>

<!-- نافذة الإضافة -->
<div class="overlay" id="addOverlay">
  <div class="dialog">
    <h3>إضافة مسبحة جديدة</h3>
    <p>اكتب اسماً واضحاً للمسبحة</p>
    <input type="text" id="nameInput" placeholder="مثال: استغفار، تسبيح، الصلاة على النبى..." maxlength="30" autocomplete="off">
    <div class="actions">
      <button class="btn-cancel" id="cancelAdd">إلغاء</button>
      <button class="btn-confirm" id="confirmAdd">إضافة</button>
    </div>
  </div>
</div>

<!-- نافذة تأكيد الحذف -->
<div class="overlay" id="delOverlay">
  <div class="dialog">
    <h3>حذف المسبحة</h3>
    <p id="delText">هل أنت متأكد من حذف هذه المسبحة؟ لا يمكن التراجع.</p>
    <div class="actions">
      <button class="btn-cancel" id="cancelDel">إلغاء</button>
      <button class="btn-danger" id="confirmDel">حذف</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'tap_counter_data_v1';
  const THEME_KEY = 'tap_counter_theme_v1';
  const PALETTE = [
    'linear-gradient(135deg, rgba(99,102,241,0.45), rgba(139,92,246,0.35))',
    'linear-gradient(135deg, rgba(236,72,153,0.45), rgba(244,63,94,0.35))',
    'linear-gradient(135deg, rgba(34,197,94,0.45), rgba(20,184,166,0.35))',
    'linear-gradient(135deg, rgba(249,115,22,0.45), rgba(234,179,8,0.35))',
    'linear-gradient(135deg, rgba(59,130,246,0.45), rgba(14,165,233,0.35))',
    'linear-gradient(135deg, rgba(168,85,247,0.45), rgba(217,70,239,0.35))',
    'linear-gradient(135deg, rgba(20,184,166,0.45), rgba(34,211,238,0.35))',
    'linear-gradient(135deg, rgba(244,63,94,0.45), rgba(251,146,60,0.35))'
  ];

  let data = [];        // [{id, name, count, tint}]
  let pendingDelete = null;
  let pressTimer = null;
  let longPressed = false;

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const addBtn = document.getElementById('addBtn');
  const themeBtn = document.getElementById('themeBtn');
  const addOverlay = document.getElementById('addOverlay');
  const delOverlay = document.getElementById('delOverlay');
  const nameInput = document.getElementById('nameInput');
  const toastEl = document.getElementById('toast');

  /* ---------- التخزين ---------- */
  function load(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(data)) data = [];
    } catch(e){ data = []; }
  }
  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
  }

  /* ---------- الثيم ---------- */
  function applyTheme(mode){
    document.body.classList.toggle('dark', mode === 'dark');
    themeBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'dark' ? '#0b1120' : '#eef2f7');
  }
  let themeMode = localStorage.getItem(THEME_KEY) || 'light';
  applyTheme(themeMode);
  themeBtn.addEventListener('click', () => {
    themeMode = themeMode === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, themeMode);
    applyTheme(themeMode);
  });

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  /* ---------- رسم الشبكة ---------- */
  function render(){
    grid.innerHTML = '';
    emptyState.style.display = data.length ? 'none' : 'block';

    data.forEach(item => {
      const el = document.createElement('div');
      el.className = 'counter';
      el.style.setProperty('--tint', item.tint || PALETTE[0]);
      el.dataset.id = item.id;

      el.innerHTML = `
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="count">${item.count}</div>
        <div class="hint">اضغط للزيادة • اضغط مطولاً للحذف</div>
      `;

      // نقر عادي = زيادة
      el.addEventListener('click', () => {
        if (longPressed) { longPressed = false; return; }
        const it = data.find(d => d.id === item.id);
        if (!it) return;
        it.count++;
        el.querySelector('.count').textContent = it.count;
        
        // تحديث النص
        const hintEl = el.querySelector('.hint');
        if(hintEl) hintEl.textContent = 'اضغط للزيادة • اضغط مطولاً للتصفير';
        
        save();
        });

      // ضغط طويل = تصفير أو طلب حذف
      el.addEventListener('pointerdown', (e) => {
        longPressed = false;
        pressTimer = setTimeout(() => {
          longPressed = true;
          const it = data.find(d => d.id === item.id);
          if (!it) return;
          if (it.count > 0) {
            it.count = 0;
            el.querySelector('.count').textContent = 0;
            
            // تحديث النص بعد التصفير
            const hintEl = el.querySelector('.hint');
            if(hintEl) hintEl.textContent = 'اضغط للزيادة • اضغط مطولاً للحذف';
            
            save();
            toast('تم تصفير: ' + it.name);
            if (navigator.vibrate) navigator.vibrate(30);
          } else {
            pendingDelete = item.id;
            document.getElementById('delText').textContent =
              'حذف "' + it.name + '"؟ لا يمكن التراجع.';
            delOverlay.classList.add('show');
            if (navigator.vibrate) navigator.vibrate([20,50,20]);
          }
        }, 600);
      });
      ['pointerup','pointerleave','pointercancel'].forEach(evt => {
        el.addEventListener(evt, () => { clearTimeout(pressTimer); });
      });

      grid.appendChild(el);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  /* ---------- إضافة مربع ---------- */
  function openAdd(){
    nameInput.value = '';
    addOverlay.classList.add('show');
    setTimeout(() => nameInput.focus(), 100);
  }
  function closeAdd(){ addOverlay.classList.remove('show'); }

  function doAdd(){
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    const item = {
      id: 'c_' + Date.now() + '_' + Math.floor(Math.random()*9999),
      name: name,
      count: 0,
      tint: PALETTE[Math.floor(Math.random() * PALETTE.length)]
    };
    data.push(item);
    save();
    closeAdd();
    render();
    toast('تمت إضافة: ' + name);
  }

  addBtn.addEventListener('click', openAdd);
  document.getElementById('cancelAdd').addEventListener('click', closeAdd);
  document.getElementById('confirmAdd').addEventListener('click', doAdd);
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') doAdd();
  });

  /* ---------- حذف ---------- */
  document.getElementById('cancelDel').addEventListener('click', () => {
    pendingDelete = null;
    delOverlay.classList.remove('show');
  });
  document.getElementById('confirmDel').addEventListener('click', () => {
    if (pendingDelete) {
      const it = data.find(d => d.id === pendingDelete);
      data = data.filter(d => d.id !== pendingDelete);
      save();
      render();
      toast(it ? 'تم حذف: ' + it.name : 'تم الحذف');
    }
    pendingDelete = null;
    delOverlay.classList.remove('show');
  });

  // إغلاق النوافذ بالضغط على الخلفية
  [addOverlay, delOverlay].forEach(ov => {
    ov.addEventListener('click', e => {
      if (e.target === ov) ov.classList.remove('show');
    });
  });

  /* ---------- تشغيل ---------- */
  load();
  render();
})();
</script>
</body>
</html>
